version: "2.0.0"

logging:
  log_file_name: test-s3-handler-integration.log
  log_folder: logs
  log_max_file_size: 1000000
  log_max_backup_count: 5
  # log_level: debug | info | warning | error | critical
  log_level: debug

monitors:
  - name: "idrive-not-versioned"
    enabled: true
    monitor_path: "data/Source/idrive-cloud-storage"
    remote_path: "test-foldermonitor/idrive-cloud-storage"
    remote_profile: "idrive-test"
    # remote_profiles: 
    #   - "idrive-test"
    #   - "idrive-test-2"
    exclude_patterns: 
      - "excluded-folder"
      - "*.tmp"
    testing:
      check_delay: 3
    backup:
      enabled: false
      interval: ""


